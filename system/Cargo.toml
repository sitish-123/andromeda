[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"
publish = false

[workspace.dependencies]
anyhow = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
futures-util = { version = "0.3", default-features = false }
log = "0.4"
netlink-sys = { version = "0.8", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "fs", "event"] }
sd-notify = "0.5"
zbus_polkit = { version = "6", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service", "object-manager"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
