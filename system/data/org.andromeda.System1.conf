<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root owns the name; anyone may call it. Reads are free; intents check polkit in the daemon. -->
<busconfig>
  <policy user="root">
    <allow own="org.andromeda.System1"/>
    <!-- Taken only when low-memory-monitor is not installed (docs/system-health.md §9). -->
    <allow own="org.freedesktop.LowMemoryMonitor"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.andromeda.System1"/>
  </policy>
</busconfig>
