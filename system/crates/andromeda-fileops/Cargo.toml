[package]
name = "andromeda-fileops"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
env_logger.workspace = true
log.workspace = true
percent-encoding = "2"
rustix = { workspace = true, features = ["fs", "process"] }
tokio.workspace = true
zbus.workspace = true
# Archives are untrusted input: pure-Rust decoders only (no libarchive, liblzma or libzstd in this process).
bzip2 = "0.6"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz", "encoder"] }
ruzstd = "0.8"
sevenz-rust2 = { version = "0.20", default-features = false, features = ["aes256", "bzip2", "compress", "util"] }
tar = { version = "0.4", default-features = false }
md-5 = "0.10"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "xz"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
