[config]

[catalog.alacritty]
name = "Alacritty"
category = "terminal"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.btop]
name = "Btop"
category = "misc"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.cava]
name = "Cava"
category = "audio"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.emacs]
name = "Emacs"
category = "editor"
documentation_url = "https://docs.noctalia.dev/noctalia/templates/official/emacs/"

[catalog.foot]
name = "Foot"
category = "terminal"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.ghostty]
name = "Ghostty"
category = "terminal"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.helix]
name = "Helix"
category = "editor"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.kitty]
name = "Kitty"
category = "terminal"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.labwc]
name = "Labwc"
category = "compositor"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.niri]
name = "Niri"
category = "compositor"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.hyprland]
name = "Hyprland"
category = "compositor"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.mango]
name = "Mango"
category = "compositor"
documentation_url = "https://docs.noctalia.dev/noctalia/templates/official/mango/"

[catalog.scroll]
name = "Scroll"
category = "compositor"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.sway]
name = "Sway"
category = "compositor"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[catalog.andromeda]
name = "Andromeda"
category = "compositor"
documentation_url = "https://docs.noctalia.dev/noctalia/templates/official/andromeda/"

[catalog.wezterm]
name = "Wezterm"
category = "terminal"
documentation_url = "https://docs.noctalia.dev/noctalia/theming/app-theming/#built-in-templates"

[templates.alacritty]
input_path = "./alacritty/alacritty.toml"
output_path = "$XDG_CONFIG_HOME/alacritty/themes/noctalia.toml"
post_hook = "bash '{{ config_dir }}/alacritty/apply.sh'"
undo_hook = "bash '{{ config_dir }}/alacritty/undo.sh'"

[templates.btop]
input_path = "./btop/btop.theme"
output_path = "$XDG_CONFIG_HOME/btop/themes/noctalia.theme"
post_hook = "bash '{{ config_dir }}/btop/apply.sh'"
undo_hook = "bash '{{ config_dir }}/btop/undo.sh'"

[templates.cava]
input_path = "./cava/cava.ini"
output_path = "$XDG_CONFIG_HOME/cava/themes/noctalia"
post_hook = "bash '{{ config_dir }}/cava/apply.sh'"
undo_hook = "bash '{{ config_dir }}/cava/undo.sh'"

[templates.emacs]
input_path = "./emacs/emacs.el"
output_path_dynamic = "bash '{{ config_dir }}/emacs/output-path.sh'"
post_hook = "bash '{{ config_dir }}/emacs/apply.sh'"
undo_hook = "bash '{{ config_dir }}/emacs/undo.sh'"

[templates.foot]
input_path = "./foot/foot"
output_path = "$XDG_CONFIG_HOME/foot/themes/noctalia"
post_hook = "bash '{{ config_dir }}/foot/apply.sh'"
undo_hook = "bash '{{ config_dir }}/foot/undo.sh'"

[templates.ghostty]
input_path = "./ghostty/ghostty"
output_path = "$XDG_CONFIG_HOME/ghostty/themes/noctalia"
post_hook = "bash '{{ config_dir }}/ghostty/apply.sh'"
undo_hook = "bash '{{ config_dir }}/ghostty/undo.sh'"

[templates.helix]
input_path = "./helix/helix.toml"
output_path = "$XDG_CONFIG_HOME/helix/themes/noctalia.toml"
undo_hook = "bash '{{ config_dir }}/helix/undo.sh'"

[templates.kitty]
input_path = "./kitty/kitty.conf"
output_path = "$XDG_CONFIG_HOME/kitty/themes/noctalia.conf"
post_hook = "bash '{{ config_dir }}/kitty/apply.sh'"
undo_hook = "bash '{{ config_dir }}/kitty/undo.sh'"

[templates.labwc]
input_path = "./labwc/labwc.conf"
output_path = "$XDG_CONFIG_HOME/labwc/noctalia.conf"
post_hook = "bash '{{ config_dir }}/labwc/apply.sh'"
undo_hook = "bash '{{ config_dir }}/labwc/undo.sh'"

[templates.niri]
input_path = "./niri/niri.kdl"
output_path_dynamic = "bash '{{ config_dir }}/niri/apply.sh' output"
post_hook = "bash '{{ config_dir }}/niri/apply.sh' apply"
undo_hook = "bash '{{ config_dir }}/niri/undo.sh'"

[templates.hyprland]
input_path_dynamic = "bash '{{ config_dir }}/hyprland/apply.sh' input"
output_path_dynamic = "bash '{{ config_dir }}/hyprland/apply.sh' output"
post_hook = "bash '{{ config_dir }}/hyprland/apply.sh' apply"
undo_hook = "bash '{{ config_dir }}/hyprland/undo.sh'"

[templates.mango]
input_path = "./mango/mango.conf"
output_path = "$XDG_CONFIG_HOME/mango/noctalia.conf"
post_hook = "bash '{{ config_dir }}/mango/apply.sh'"
undo_hook = "bash '{{ config_dir }}/mango/undo.sh'"

[templates.scroll]
input_path = "./scroll/scroll"
output_path = "$XDG_CONFIG_HOME/scroll/noctalia"
post_hook = "bash '{{ config_dir }}/scroll/apply.sh'"
undo_hook = "bash '{{ config_dir }}/scroll/undo.sh'"

[templates.sway]
input_path = "./sway/sway"
output_path = "$XDG_CONFIG_HOME/sway/noctalia"
post_hook = "bash '{{ config_dir }}/sway/apply.sh'"
undo_hook = "bash '{{ config_dir }}/sway/undo.sh'"

[templates.andromeda]
input_path = "./andromeda/andromeda.toml"
output_path = "$XDG_CONFIG_HOME/andromeda/noctalia.toml"
post_hook = "bash '{{ config_dir }}/andromeda/apply.sh'"
undo_hook = "bash '{{ config_dir }}/andromeda/undo.sh'"

[templates.wezterm]
input_path = "./wezterm/wezterm.toml"
output_path = "$XDG_CONFIG_HOME/wezterm/colors/Noctalia.toml"
post_hook = "bash '{{ config_dir }}/wezterm/apply.sh'"
undo_hook = "bash '{{ config_dir }}/wezterm/undo.sh'"
