# The design system's fixed values (docs/design-system.md). protocol/gen-design-tokens.py turns this file into the
# C++ header the shell and the compositor build with. Floats stay floats, integers stay integers, "#rrggbbaa"
# strings become packed RGBA colors, other strings become string views. A table whose children are tables with the
# same keys (scheme.light / scheme.dark, type.*, elevation.*, spring.*) becomes a struct with one constant per child.

[radius]  # px; a nested radius is the outer radius minus the padding
# Corner smoothing (0 = circular arc, 0.6 = iOS continuous corner). A corner of radius r becomes a superellipse that
# starts r x (1 + 0.88 s) from the corner with exponent 2 + 5 s; a corner that cannot grow (pill, circle) stays round.
smoothing = 0.6
xs = 6.0
sm = 10.0
md = 14.0
lg = 20.0
xl = 28.0
pill = 999.0

[space]  # px, 4-point grid
s1 = 4.0
s2 = 8.0
s3 = 12.0
s4 = 16.0
s5 = 20.0
s6 = 24.0

[font]
family = "Inter"

# line_height is a multiple of size (CSS line-height); a label box is size x line_height, text centered in it.

[type.mini]
size = 11.0
weight = 500
line_height = 1.25
[type.caption]
size = 11.5
weight = 500
line_height = 1.25
[type.body]
size = 13.0
weight = 500
line_height = 1.3
[type.title]
size = 13.5
weight = 600
line_height = 1.25
[type.large]
size = 15.0
weight = 600
line_height = 1.2
[type.header]
size = 20.0
weight = 600
line_height = 1.2

# Semantic color roles. tint_* is a material's fill over the compositor blur; solid_* replaces it when reduce
# transparency is on. The accent is the default; the live accent setting overrides it. window..separator are the
# opaque backgrounds for GTK and Qt apps ({{tokens.<role>.<format>}} in shell templates).
[scheme.light]
label_1 = "#141418eb"
label_2 = "#14141894"
label_3 = "#1414185c"
fill_1 = "#ffffff9e"
fill_2 = "#0000000d"
fill_3 = "#00000017"
tint_thin = "#f6f6fa8c"
tint_regular = "#ffffff9e"
tint_thick = "#ffffffc2"
solid_thin = "#ececf1ff"
solid_regular = "#f2f2f6ff"
solid_thick = "#f8f8faff"
stroke = "#00000014"
edge = "#ffffff8c"
accent = "#2f6bffff"
on_accent = "#ffffffff"
danger = "#ff3b30ff"
shadow = "#00000038"
window = "#f2f2f6ff"
view = "#ffffffff"
card = "#ffffffff"
header = "#ececf1ff"
popover = "#f8f8faff"
sidebar = "#ececf1ff"
separator = "#0000001f"

[scheme.dark]
label_1 = "#f5f5f7eb"
label_2 = "#f5f5f794"
label_3 = "#f5f5f75c"
fill_1 = "#ffffff1a"
fill_2 = "#ffffff0d"
fill_3 = "#ffffff1f"
tint_thin = "#1c1c208c"
tint_regular = "#1c1c20b3"
tint_thick = "#202024d6"
solid_thin = "#1c1c20ff"
solid_regular = "#222226ff"
solid_thick = "#28282cff"
stroke = "#ffffff14"
edge = "#ffffff1f"
accent = "#4a80ffff"
on_accent = "#ffffffff"
danger = "#ff453aff"
shadow = "#00000066"
window = "#1e1e22ff"
view = "#18181bff"
card = "#28282cff"
header = "#222226ff"
popover = "#28282cff"
sidebar = "#1c1c20ff"
separator = "#ffffff1a"

# One blur recipe for every material, drawn by the compositor and cached while the backdrop is static.
[blur]
passes = 3
radius = 6
noise = 0.02
brightness = 0.95
contrast = 0.95
saturation = 1.6

# Light-scheme recipe; the shell applies it to the compositor while the shell mode is light.
[blur_light]
brightness = 1.05
contrast = 1.0
saturation = 1.8

# Drawn by the compositor. softness and offset in px; opacity scales the scheme's shadow color.
[elevation.e1]
softness = 14
offset_x = 0
offset_y = 4
opacity = 0.6
[elevation.e2]
softness = 48
offset_x = 0
offset_y = 18
opacity = 1.0

[motion]  # ms
fast = 120
normal = 200
slow = 320

# damping is the ratio to critical damping: 1.0 settles without overshoot.
[spring.standard]
stiffness = 900.0
damping = 1.0
[spring.snappy]
stiffness = 1400.0
damping = 1.0
[spring.bouncy]
stiffness = 700.0
damping = 0.8

# Presets by use (docs: .agent/anim-research.md). Spatial springs may overshoot; effects (opacity, blur) never do.
[spring.open]
stiffness = 380.0
damping = 0.65
[spring.close]
stiffness = 500.0
damping = 1.0
[spring.island_expand]
stiffness = 200.0
damping = 0.6
[spring.island_collapse]
stiffness = 380.0
damping = 0.85
[spring.page]
stiffness = 700.0
damping = 0.9
[spring.press]
stiffness = 1500.0
damping = 1.0
[spring.release]
stiffness = 800.0
damping = 0.6
[spring.effects]
stiffness = 1600.0
damping = 1.0
[spring.effects_fast]
stiffness = 3800.0
damping = 1.0

# Component anatomy (docs/design-system.md "Components", docs/design/reference.html). px at scale 1.
# A value equal to a scale token says so in its comment. A string "= a.b - c.d" is computed from other tokens: every
# nested radius is "= <outer radius> - <outer padding>", so it cannot drift from its container.
[component.island]
height = 34.0
margin = 8.0         # from the screen edge and between an island and its sheet
padding_x = 16.0     # s4
gap = 12.0           # s3
icon = 16.0
logo = 18.0
dot = 7.0            # workspace dot
dot_active_width = 20.0
dot_active_radius = 4.0
dot_gap = 5.0

[component.island_center]
rest_width = 160.0   # rest pill of the always-on center island

[component.live]
height = 52.0
radius = 26.0
padding = 8.0        # s2
gap = 12.0           # s3
lead = 36.0          # round leading icon
button = 36.0
progress_width = 150.0
progress_height = 6.0
tint = "#16161acc"   # dark in both schemes; labels are white

[component.sheet]
width = 360.0
radius = 28.0        # xl
padding = 12.0       # s3
gap = 8.0            # s2
open_drag = 240.0    # drag distance that opens the sheet fully from its island

[component.card]
radius = "= component.sheet.radius - component.sheet.padding"
padding = 12.0       # s3
row_gap = 12.0       # between the rows of the connectivity card; icon to text in a wide row
small_gap = 8.0      # icon to text in a small card

[component.round_icon]
size = 30.0
glyph = 16.0
action = 32.0        # phone card actions
action_gap = 6.0

[component.slider]
height = 40.0
radius = "= component.sheet.radius - component.sheet.padding"
icon_inset = 14.0
value_inset = 16.0
fill = "#ffffffff"   # white in both schemes; the icon on it is black 60 %

[component.media]
art = 40.0
art_radius = "= component.card.radius - component.card.padding"
controls_gap = 12.0  # s3

[component.dock]
margin = 12.0
padding = 10.0
radius = 30.0
gap = 10.0
icon = 54.0
icon_radius = "= component.dock.radius - component.dock.padding"
running_width = 14.0
running_height = 3.0
running_offset = 4.0 # gap between the icon and the running bar
separator_inset = 8.0

[component.badge]
height = 18.0
overhang = 4.0       # past the icon's top and side edges
padding_x = 5.0
font = 11.0
font_weight = 600
