# The rulebook's values as data (docs/design/rulebook.md wins where they differ). protocol/gen-design-tokens.py turns
# this file into the C++ header the shell and the compositor build with, CSS, GTK, Qt, KDE and fcitx5 themes.
# Floats stay floats, integers stay integers, "#rrggbbaa" strings become packed RGBA colors, other strings become
# string views. A table whose children are tables with the same keys (scheme.*, type.*, elevation.*, spring.*)
# becomes a struct with one constant per child. A string "= a.b - c.d" is computed from other tokens.
# Every length is logical px at ui_scale 1 and a multiple of 4 (rulebook R1); 2 only inside controls of 32 or less.

[radius]  # rulebook 2.1; nested radius = outer radius - padding (R7)
# Corner smoothing (0 = circular arc, 0.6 = Figma's iOS match). Our fit: a corner of radius r starts r x (1 + 0.88 s)
# from the corner, exponent 2 + 5 s; a corner that cannot grow (pill, circle) stays round.
smoothing = 0.6
r4 = 4.0
r8 = 8.0
r12 = 12.0
r16 = 16.0
r20 = 20.0
r24 = 24.0
r28 = 28.0
pill = 999.0

[space]  # rulebook 2.1
p2 = 2.0             # inside controls of height 32 or less only
p4 = 4.0
p8 = 8.0
p12 = 12.0
p16 = 16.0
p20 = 20.0
p24 = 24.0
p32 = 32.0
p40 = 40.0
p48 = 48.0
p64 = 64.0
chrome_gap = 8.0     # R8: floating chrome to the screen edge and to other chrome

[size]  # rulebook 2.1
control_s = 24.0
control_m = 32.0
control_l = 40.0
control_xl = 48.0    # touch
row_compact = 32.0
row = 40.0
row_two_compact = 48.0
row_two = 56.0
symbol_inline = 12.0
symbol = 16.0
symbol_l = 20.0
hit_min = 24.0
hit_touch = 40.0

[font]
family = "Inter"

# line is the line box in px (a multiple of 4); tracking in em, from Inter's dynamic metrics
# (-0.0223 + 0.185 e^(-0.1745 size)). A label box is one line box per line, text centred in it.
[type.caption]
size = 11.0
line = 16.0
weight = 500
tracking = 0.0048
[type.footnote]
size = 12.0
line = 16.0
weight = 400
tracking = 0.0005
[type.body]
size = 13.0
line = 16.0
weight = 400
tracking = -0.0032
[type.paragraph]
size = 13.0
line = 20.0
weight = 400
tracking = -0.0032
[type.headline]
size = 13.0
line = 16.0
weight = 600
tracking = -0.0032
[type.title3]
size = 15.0
line = 20.0
weight = 600
tracking = -0.0088
[type.title2]
size = 17.0
line = 24.0
weight = 600
tracking = -0.0128
[type.title1]
size = 22.0
line = 28.0
weight = 600
tracking = 0.0
[type.large]
size = 28.0
line = 36.0
weight = 600
tracking = 0.0
[type.display]
size = 34.0
line = 40.0
weight = 500
tracking = 0.0
[type.hero]
size = 80.0
line = 80.0
weight = 300
tracking = 0.0

[type_rules]
glass_weight_add = 100   # body and footnote on glass: 400 -> 500
text_scale_s = 0.92
text_scale_l = 1.15
text_scale_xl = 1.3

# Colour roles (rulebook 4.1). Labels and fills are black (light) or white (dark) at an opacity. tint_* is a
# material's fill over the compositor blur; solid_* replaces it when reduce transparency is on. accent / danger are
# fills with white content on them; accent_text / danger_text are for symbols and text on planes. window..separator
# are the opaque backgrounds for GTK and Qt apps. shadow is the elevation colour; the level gives the opacity.
[scheme.light]
label_1 = "#141418eb"
label_2 = "#1414189e"
label_3 = "#14141861"
fill_1 = "#0000000a"
fill_2 = "#00000014"
fill_3 = "#0000001f"
separator = "#00000014"
stroke = "#00000012"
edge = "#ffffffbf"
lens = "#ffffffeb"
lens_edge = "#00000000"
tint_thin = "#f6f6fa8c"
tint_regular = "#ffffff9e"
tint_thick = "#ffffffc2"
solid_thin = "#ececf1ff"
solid_regular = "#f2f2f6ff"
solid_thick = "#f8f8faff"
accent = "#5147e5ff"
accent_text = "#5147e5ff"
on_accent = "#ffffffff"
danger = "#d93025ff"
danger_text = "#d93025ff"
warning = "#b45309ff"
success = "#1a7f37ff"
slider_fill = "#ffffffef"
on_slider_fill = "#1414189e"
slider_track = "#0000000f"
slider_edge = "#00000000"
scrim = "#00000033"
shadow = "#141428ff"
window = "#f2f2f6ff"
view = "#ffffffff"
card = "#ffffffff"
header = "#ececf1ff"
popover = "#f8f8faff"
sidebar = "#ececf1ff"

[scheme.dark]
label_1 = "#f4f4f6eb"
label_2 = "#f4f4f69e"
label_3 = "#f4f4f661"
fill_1 = "#ffffff0f"
fill_2 = "#ffffff1a"
fill_3 = "#ffffff29"
separator = "#ffffff14"
stroke = "#ffffff14"
edge = "#ffffff1f"
lens = "#ffffff24"
lens_edge = "#ffffff2e"
tint_thin = "#1c1c208c"
tint_regular = "#1c1c20b3"
tint_thick = "#202024d6"
solid_thin = "#1c1c20ff"
solid_regular = "#222226ff"
solid_thick = "#28282cff"
accent = "#6159f5ff"
accent_text = "#8c85ffff"
on_accent = "#ffffffff"
danger = "#d93025ff"
danger_text = "#ff6b5eff"
warning = "#f5a524ff"
success = "#3fb950ff"
slider_fill = "#ffffff3d"
on_slider_fill = "#ffffffeb"
slider_track = "#ffffff1a"
slider_edge = "#00000000"
scrim = "#00000066"
shadow = "#000000ff"
window = "#1e1e22ff"
view = "#18181bff"
card = "#28282cff"
header = "#222226ff"
popover = "#28282cff"
sidebar = "#1c1c20ff"

# One blur recipe for every material, drawn by the compositor and cached while the backdrop is static.
[blur]
passes = 3
radius = 6
noise = 0.02
brightness = 0.95
contrast = 0.95
saturation = 1.6

# Light-scheme recipe; the shell applies it to the compositor while the shell mode is light.
[blur_light]
brightness = 1.05
contrast = 1.0
saturation = 1.8

# Drawn by the compositor (rulebook 5.4). Two shadows per level: key (y = 3/8 of blur) and contact. blur and y in px;
# opacity scales the scheme's shadow colour, per scheme. e0 (stroke only) has no entry.
[elevation.e1]  # the lens, toggle and slider knobs
key_y = 1.0
key_blur = 2.0
key_light = 0.10
key_dark = 0.30
contact_y = 0.0
contact_blur = 0.0
contact_light = 0.0
contact_dark = 0.0
[elevation.e2]  # float plane: bar islands, dock, center island at rest
key_y = 6.0
key_blur = 16.0
key_light = 0.12
key_dark = 0.30
contact_y = 1.0
contact_blur = 4.0
contact_light = 0.08
contact_dark = 0.20
[elevation.e3]  # over plane: sheets, menus, banners, tooltips, inactive windows
key_y = 12.0
key_blur = 32.0
key_light = 0.16
key_dark = 0.40
contact_y = 2.0
contact_blur = 8.0
contact_light = 0.08
contact_dark = 0.24
[elevation.e4]  # active windows, dialogs
key_y = 24.0
key_blur = 64.0
key_light = 0.22
key_dark = 0.50
contact_y = 2.0
contact_blur = 8.0
contact_light = 0.10
contact_dark = 0.30

# Springs (rulebook 7.2), mass 1. stiffness = (2 pi / response)^2, damping = ratio to critical = 1 - bounce.
# Spatial springs may overshoot; effect springs (fade, fade_out) never do. There are no duration animations.
[spring.snap]      # response 0.26 s, bounce 0.15: lens leading edge, toggle knob, small control positions
stiffness = 584.0
damping = 0.85
[spring.trail]     # response 0.34 s, bounce 0.20: lens trailing edge
stiffness = 341.5
damping = 0.80
[spring.move]      # response 0.35 s, bounce 0.10: reflow, banner stack, tiling
stiffness = 322.3
damping = 0.90
[spring.open]      # response 0.42 s, bounce 0.22: Grow from a source
stiffness = 223.8
damping = 0.78
[spring.close]     # response 0.28 s, bounce 0: Return, dismissals
stiffness = 503.6
damping = 1.00
[spring.morph]     # response 0.46 s, bounce 0.18: center island expands
stiffness = 186.6
damping = 0.82
[spring.collapse]  # response 0.42 s, bounce 0.20: center island returns to rest
stiffness = 223.8
damping = 0.80
[spring.page]      # response 0.32 s, bounce 0.05: pages, workspaces, gesture release with velocity
stiffness = 385.5
damping = 0.95
[spring.press]     # response 0.12 s, bounce 0
stiffness = 2741.6
damping = 1.00
[spring.release]   # response 0.32 s, bounce 0.25
stiffness = 385.5
damping = 0.75
[spring.fade]      # response 0.16 s, bounce 0: opacity, colour, blur in
stiffness = 1542.1
damping = 1.00
[spring.fade_out]  # response 0.10 s, bounce 0: opacity, colour, blur out
stiffness = 3947.8
damping = 1.00

[motion]  # rulebook 7.4 / 7.7
content_gate = 0.35      # content fades in after this fraction of the shape's travel
face_gate = 0.5          # Morph: the incoming face fades in after this fraction
return_face_gate = 0.7   # Return: the source face fades back in after this fraction of the close travel
stagger_ms = 16
stagger_max = 6
face_scale = 0.92
face_blur = 8.0
press_scale_small = 0.96 # items up to 96 px
press_scale_medium = 0.98 # items up to 240 px
slop = 8.0
rubber_band = 0.55
projection_decay = 0.998
open_velocity = 300.0    # px/s toward open
loading_delay_ms = 200
loading_min_ms = 400

# Component anatomy (rulebook 9). A value equal to a scale token says so in its comment; a nested radius is an
# expression so it cannot drift from its container.
[component.island]  # 9.1
height = 32.0
inset_symbol = 8.0   # R5: (32 - 16) / 2
inset_text = 12.0    # R5: 32 x 3/8
gap = 8.0            # inside a group
group_gap = 12.0     # between groups (R3)
icon = 16.0
cell = 24.0          # workspace cell, capsule
cell_inset = 4.0     # R7: 16 - 4 = 12 = capsule 24
divider_height = 12.0
privacy_dot = 6.0

[component.island_center]
rest_width = 160.0
osd_width = 240.0
osd_height = 40.0
expanded_width = 360.0
live_height = 56.0
live_padding = 8.0   # R5: (56 - 40) / 2
live_lead = 40.0
banner_height = 88.0 # 12 + 64 + 12; media uses the same height
banner_radius = 24.0
banner_padding = 12.0
banner_icon = 32.0
art = 48.0
art_radius = "= component.island_center.banner_radius - component.island_center.banner_padding"
level_height = 4.0

[component.sheet]  # 9.3
width = 360.0
radius = 28.0        # r28
padding = 12.0
gap = 8.0
column = 164.0       # (360 - 24 - 8) / 2
open_drag = 240.0    # drag distance that opens the sheet fully from its island
detail_header = 48.0 # 9.16 detail page header

[component.tile]
height = 56.0
radius = "= component.sheet.radius - component.sheet.padding"
padding = 12.0
gap = 12.0           # R4: round icon to text

[component.round_icon]
size = 32.0
glyph = 16.0
action = 32.0
action_gap = 8.0

[component.slider]  # sheet slider pill
height = 48.0
radius = "= component.sheet.radius - component.sheet.padding"
inset = 16.0         # symbol and value: (48 - 16) / 2

[component.media]
height = 72.0
padding = 8.0        # image-led card
art = 56.0
art_radius = "= component.tile.radius - component.media.padding"
controls_gap = 8.0

[component.edit]  # 9.16 edit mode
badge_remove = 16.0  # label_2 circle at -4 / -4
badge_add = 20.0     # accent circle, centred at the tile's right inset 12
badge_inset = 4.0
drag_scale = 1.04

[component.page_dots]
row = 16.0
dot = 6.0
current_width = 16.0
gap = 6.0

[component.dock]  # 9.4
height = 64.0
radius = 24.0        # r24
padding = 8.0
gap = 8.0
icon = 48.0
lens = 56.0
lens_radius = "= component.dock.radius - component.dock.lens_inset"
lens_inset = 4.0
running_dot = 4.0
separator_height = 32.0

[component.badge]
height = 16.0
padding_x = 4.0
overhang = 4.0

[component.button]  # 9.5; small and regular r 8, large and primary capsules
