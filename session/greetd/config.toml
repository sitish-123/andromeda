[terminal]
vt = 1
# andromeda-greetd: the VT stays in graphics mode, and a login starts the session on a free VT while the greeter
# stays on screen until the switch, so no console or black frame shows between them.
graphics = true
handoff = true

[general]
# User logins run /etc/pam.d/gdm-face: pam_gaze hands the keyring password over only under that service name.
service = "gdm-face"

[default_session]
command = "/usr/bin/andromeda-greeter-session"
user = "greeter"
# The greeter user's own session needs no pam_gnome_keyring: under general.service it starts a keyring daemon for
# a user without a home and logs "couldn't unlock the login keyring".
service = "greetd"
