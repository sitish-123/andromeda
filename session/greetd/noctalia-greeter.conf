# greetd's package owns /etc/greetd/config.toml, so the greeter's config is passed on the command line instead.
[Unit]
# config.toml runs on VT 1. Arch's greetd.service already conflicts with getty@tty1; Ubuntu's expects VT 7 and leaves a
# getty on tty1, which holds the VT so the greeter never starts.
Conflicts=getty@tty1.service
After=getty@tty1.service

[Service]
ExecStart=
# Bare name, as greetd.service itself: Arch installs /usr/bin/greetd, Debian and Ubuntu /usr/sbin/greetd.
ExecStart=greetd --config /usr/share/noctalia-greeter/greetd.toml
