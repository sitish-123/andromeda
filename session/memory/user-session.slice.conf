# A cgroup's memory.min never exceeds its parent's, so the compositor's and shell's MemoryMin need a floor on every
# slice above them: session.slice (user manager), user@.service, user-.slice and user.slice (system manager).
[Slice]
MemoryMin=1G
# Wins CPU time over app.slice (100); the compositor and shell threads that are not SCHED_RR need it under build load.
CPUWeight=1000
# io.latency: io.weight does nothing here (io.cost.qos unset, kyber/mq-deadline/none), but io.latency works under every
# scheduler; when session.slice IO misses the target, the kernel cuts the queue depth of app.slice. "/" resolves to its disk.
IODeviceLatencyTargetSec=/ 10ms
IODeviceLatencyTargetSec=/home 10ms
