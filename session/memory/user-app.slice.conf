# Apps (docs/qos.md §5): the focused app's scope gets MemoryLow from the compositor; a scope's protection holds only up
# to its parents', so app.slice and every slice above it carry the same 25 %. Under pressure, oomd kills a runaway app
# before the session freezes; the compositor and shell run in session.slice and stay.
[Slice]
MemoryLow=25%
ManagedOOMMemoryPressure=kill
