# Apps (docs/qos.md §5): the focused app's scope gets MemoryMin (12.5 % of RAM) and MemoryLow (25 %) from the
# compositor; a scope's protection holds only up to its parents', so app.slice and every slice above it carry a floor.
# Under pressure, oomd kills a runaway app before the session freezes; the compositor and shell run in session.slice.
[Slice]
MemoryMin=12.5%
MemoryLow=25%
ManagedOOMMemoryPressure=kill
