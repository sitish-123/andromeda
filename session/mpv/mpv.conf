# Andromeda default for mpv. ~/.config/mpv/mpv.conf loads after this file and overrides it.
# Frames reach the compositor as dmabufs, so a video can go to a display plane and mpv renders nothing on the GPU.
# Software-decoded frames work too; the gpu outputs are the fallback outside Wayland.
vo=dmabuf-wayland,gpu-next,gpu
hwdec=auto-safe
