# A tag files-v*, player-v* or viewer-v* builds only that app (Files and Viewer also the preview) and adds its packages
# to the repositories the desktop releases serve: the pacman and Ubuntu apt repository of the latest v* release
# (releases/latest/download) and the Debian apt repository (releases/download/debian). The app's own release holds
# its Arch packages and is never marked latest. The tag version must match the app's meson project version.
# A v* release with the app package split must exist first: andromeda 0.2.8 and older own the app files.
# Dry run: run by hand with publish off; the packages stay as workflow artifacts.
name: release-apps

on:
  push:
    tags: ["files-v*", "player-v*", "viewer-v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "App tag (files-v0.1.0); it must exist unless ref is set", required: true }
      ref: { description: "Commit or branch to build instead of the tag", required: false }
      publish: { description: "Publish to the releases and repositories", type: boolean, default: true }

permissions:
  contents: write

# Each run rewrites the shared repository indexes: runs wait for each other.
concurrency:
  group: app-repositories
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.version.outputs.app }}
      deb: ${{ steps.version.outputs.deb }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REF }}
      - id: version
        run: |
          app=${TAG%%-v*} version=${TAG#*-v}
          declared=$(sed -n "s/^ *version: *'\([^']*\)'.*/\1/p" "apps/$app/meson.build" | head -n 1)
          if [[ $declared != "$version" ]]; then
            echo "::error::$TAG does not match apps/$app/meson.build version '$declared'"
            exit 1
          fi
          # Above the last v* release and below the next one, so apt upgrades in both directions of the cycle.
          base=$(git describe --tags --match 'v[0-9]*' --abbrev=0)
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "deb=${base#v}+r$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  arch:
    needs: [version]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      ANDROMEDA_APP: ${{ needs.version.outputs.app }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git zstd github-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REF }}
      - name: Build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          chown -R builder: "$GITHUB_WORKSPACE"
      - name: Packages
        working-directory: pkg
        run: >
          sudo -u builder env HOME=/home/builder CARGO_HOME=/home/builder/.cargo ANDROMEDA_SOURCE="file://$GITHUB_WORKSPACE"
          ANDROMEDA_APP="$ANDROMEDA_APP" makepkg --syncdeps --noconfirm --force
      - name: Repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          latest=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          mkdir repo
          gh release download "$latest" -R "$GITHUB_REPOSITORY" -D repo \
            -p andromeda.db.tar.gz -p andromeda.db.tar.gz.sig -p andromeda.files.tar.gz -p andromeda.files.tar.gz.sig
          # GitHub rewrites ':' in asset names (the epoch); pacman reads the version from inside the package.
          for package in pkg/*.pkg.tar.zst; do
            name=$(basename "$package")
            cp "$package" "repo/${name//:/.}"
          done
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          for package in repo/*.pkg.tar.zst; do gpg --batch --detach-sign --no-armor -u "$key" "$package"; done
          # repo-add replaces the older entry of each package.
          repo-add --sign --key "$key" repo/andromeda.db.tar.gz repo/*.pkg.tar.zst
          rm -f repo/*.old repo/*.old.sig
          # Release assets cannot be symlinks.
          for link in andromeda.db andromeda.db.sig andromeda.files andromeda.files.sig; do cp --remove-destination "$(readlink -f "repo/$link")" "repo/$link"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: repo/
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest=false \
            || gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber repo/*.pkg.tar.zst repo/*.pkg.tar.zst.sig
          gh release upload "$LATEST" -R "$GITHUB_REPOSITORY" --clobber repo/*

  deb:
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ["26.04", testing]
    env:
      ANDROMEDA_APP: ${{ needs.version.outputs.app }}
      DEB_VERSION: ${{ needs.version.outputs.deb }}
    steps:
      - run: echo "UBUNTU_BUILD_CPUS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REF }}
      - name: Packages
        run: tools/ubuntu-deb.sh --clean ${{ matrix.base }}
      - name: Repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          BASE: ${{ matrix.base }}
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
          # Ubuntu's apt repository is the latest v* release; Debian's is the rolling "debian" release.
          if [[ $BASE == testing ]]; then target=debian; else target=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          echo "TARGET=$target" >> "$GITHUB_ENV"
          mkdir apt
          shopt -s nullglob
          out=$HOME/.cache/andromeda-ubuntu/deb-$BASE
          for deb in "$out/andromeda-${ANDROMEDA_APP}_"*.deb "$out/andromeda-preview_"*.deb; do
            name=$(basename "$deb")
            cp "$deb" "apt/${name//:/.}"
          done
          cd apt
          if ! gh release download "$target" -R "$GITHUB_REPOSITORY" -p Packages -O ../Packages.old; then
            echo "::error::release $target has no apt index (Packages): publish a v* release with the $BASE repository first"
            exit 1
          fi
          # --multiversion keeps the older entries; apt installs the highest version.
          { cat ../Packages.old; echo; dpkg-scanpackages --multiversion . /dev/null; } | cat -s > Packages
          gzip -k9 Packages
          apt-ftparchive release . > Release
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.base }}
          path: apt/
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TARGET" -R "$GITHUB_REPOSITORY" --clobber apt/*
