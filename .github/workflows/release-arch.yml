# A tag v* builds and signs the Arch packages and their pacman repository.
# Each release workflow runs on its own and adds its assets to the GitHub release of the tag, which the first one to
# finish creates. Run it by hand with a tag to rebuild only that part. The assets also serve as a pacman and an apt
# repository at releases/latest/download (see README.md).
name: release-arch

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to build and publish", required: true }
      ref: { description: "Commit or branch to build instead of the tag, for a packaging fix", required: false }
      prebuilt: { description: "Sign the packages already on the release instead of building them", type: boolean, default: false }

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  packages:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git ccache zstd github-cli
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || env.TAG }}
          # pkg/andromeda-link.install links into the Link submodule.
          submodules: recursive
      # makepkg's ccache option compiles through ccache; LTO objects cache too, only the final link reruns.
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.prebuilt }}
        with:
          path: .ccache
          key: ccache-release-arch-${{ github.run_id }}
          restore-keys: ccache-release-arch-
      - name: Build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          mkdir -p .ccache
          chown -R builder: "$GITHUB_WORKSPACE"
          sed -i 's/^BUILDENV=(\(.*\)!ccache/BUILDENV=(\1ccache/' /etc/makepkg.conf
      # Under fakeroot cargo resolves its home from the faked root uid; meson install reruns the stale cargo targets.
      - name: Packages
        if: ${{ !inputs.prebuilt }}
        working-directory: pkg
        run: >
          sudo -u builder env HOME=/home/builder CARGO_HOME=/home/builder/.cargo ANDROMEDA_SOURCE="file://$GITHUB_WORKSPACE"
          CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          makepkg --syncdeps --noconfirm --force
      - uses: actions/cache/save@v4
        if: always() && !inputs.prebuilt
        with:
          path: .ccache
          key: ccache-release-arch-${{ github.run_id }}
      # A local build uploads its packages to the release first (gh release upload); this only signs them.
      - name: Prebuilt packages
        if: ${{ inputs.prebuilt }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.pkg.tar.zst' -D pkg
      - name: Repository
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          mkdir repo
          # GitHub rewrites ':' in asset names, which would break the epoch's filenames; pacman reads the version
          # from inside the package, not its name.
          for package in pkg/*.pkg.tar.zst; do
            name=$(basename "$package")
            cp "$package" "repo/${name//:/.}"
          done
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          for package in repo/*.pkg.tar.zst; do gpg --batch --detach-sign --no-armor -u "$key" "$package"; done
          repo-add --sign --key "$key" repo/andromeda.db.tar.gz repo/*.pkg.tar.zst
          # Release assets cannot be symlinks.
          for link in andromeda.db andromeda.db.sig andromeda.files andromeda.files.sig; do cp --remove-destination "$(readlink -f "repo/$link")" "repo/$link"; done
      - uses: actions/upload-artifact@v4
        with:
          name: repo
          path: repo/

  publish:
    needs: [packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            install.sh
            andromeda-release.asc
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v4
        with: { name: repo, path: repo }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber repo/* src/install.sh src/andromeda-release.asc
