# The whole desktop built with the compositor's tests, in an Arch container with the packages' dependencies.
# A newer push to main cancels the run before it. Other branches and pull requests are checked locally (CONTRIBUTING.md).
name: check-arch

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.github/workflows/**"
      - ".github/workflows/check-arch.yml"
  workflow_dispatch:

concurrency:
  group: check-arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed git just ccache zstd
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build dependencies
        run: |
          source pkg/PKGBUILD
          pacman -S --noconfirm --needed "${makedepends[@]}"
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
          # The container runs as root on a checkout the runner user owns; git refuses it without this.
          git config --global --add safe.directory "$PWD"
      # Meson uses ccache when it is on PATH; each run saves a new key and restores the newest.
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-arch-${{ github.run_id }}
          restore-keys: ccache-arch-
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            link
            system
      - name: Build
        run: just build
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ccache-arch-${{ github.run_id }}
      # As root, files with mode 000 stay readable, so the unreadable-config tests need a normal user.
      - name: Compositor tests
        run: |
          useradd -m tester
          chown -R tester: .
          su tester -c 'cd compositor && just test'
