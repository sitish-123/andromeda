# A tag v* builds the Debian testing debs and signs a rolling apt repository, with Link's deb from Link's release of
# the same tag. Debian testing also serves sid and Kali; Debian 13 lacks libglycin-2.
# The assets go to the "debian" GitHub release (releases/download/debian/); see README.md.
name: release-debian

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to build and publish", required: true }
      ref: { description: "Commit or branch to build instead of the tag, for a packaging fix", required: false }

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  debian:
    name: testing
    runs-on: ubuntu-latest
    steps:
      - run: echo "UBUNTU_BUILD_CPUS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || env.TAG }}
      - name: xwayland-satellite
        run: tools/deb-xwayland-satellite.sh testing
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/andromeda-ubuntu/ccache-deb-testing
          key: ccache-deb-testing-${{ github.run_id }}
          restore-keys: ccache-deb-testing-
      - name: Packages
        run: DEB_VERSION=${TAG#v} tools/ubuntu-deb.sh --clean testing
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ~/.cache/andromeda-ubuntu/ccache-deb-testing
          key: ccache-deb-testing-${{ github.run_id }}
      - name: Link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 40); do
            gh release download "$TAG" -R sitish-123/andromeda-link -p '*_amd64.deb' -D "$RUNNER_TEMP/link" && exit 0
            sleep 60
          done
          exit 1
      - name: Repository
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
          out=$HOME/.cache/andromeda-ubuntu
          shopt -s nullglob
          mkdir apt
          for deb in "$out"/deb-testing/*.deb "$out"/xwayland-satellite-testing/*.deb "$RUNNER_TEMP"/link/*.deb; do
            name=$(basename "$deb")
            cp "$deb" "apt/${name//:/.}"
          done
          cd apt
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -k9 Packages
          apt-ftparchive release . > Release
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-testing
          path: apt/

  publish:
    needs: [debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: apt-testing, path: apt-debian }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view debian --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create debian --repo "$GITHUB_REPOSITORY" \
            --latest=false --title "Debian apt repository" --notes "Rolling apt repository for Debian testing, sid and Kali. See README.md."
          gh release upload debian --repo "$GITHUB_REPOSITORY" --clobber apt-debian/*
          gh release view debian --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r name; do
            [[ -e apt-debian/$name ]] || gh release delete-asset debian "$name" --repo "$GITHUB_REPOSITORY" -y
          done
