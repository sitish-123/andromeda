# Link's gate and its network E2E tests.
# A newer push to main cancels the run before it. Other branches and pull requests are checked locally (CONTRIBUTING.md).
name: check-link

on:
  push:
    branches: [main]
    paths:
      - "link"
      - "tests/e2e/quickshare*"
      - ".github/workflows/check-link.yml"
  workflow_dispatch:

concurrency:
  group: check-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgl-dev libegl-dev libxkbcommon-dev dbus python3-dbus python3-gi
          rustup component add clippy rustfmt
          # The socket test runs the daemon in its own user and network namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Ubuntu's Qt is older than the 6.7 that link-desk needs. The system python3 keeps python3-dbus and python3-gi for the tests.
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with: { version: "6.12.0", modules: qtmultimedia, cache: true, setup-python: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: link, cache-on-failure: true }
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with: { tool: cargo-deny }
      - name: Gate
        working-directory: link
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo deny check

  link-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgl-dev libegl-dev libxkbcommon-dev dbus libglib2.0-bin python3-gi iproute2 nftables
          # The tests put the phone and the desktop in their own user and network namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Ubuntu's Qt is older than the 6.7 that link-desk needs. The system python3 keeps python3-dbus and python3-gi for the tests.
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with: { version: "6.12.0", modules: qtmultimedia, cache: true, setup-python: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: link, cache-on-failure: true }
      - name: Build
        working-directory: link
        run: cargo build
      - name: Tests
        run: |
          for test in link/tests/e2e/{link_pair,link_share,link_status,link_files,link_firewall,link_bluetooth,link_hotspot,link_wifi_direct,link_tailnet} \
            tests/e2e/quickshare_daemon; do
            echo "::group::$test"
            bash "$test.sh"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: link-e2e-artifacts
          path: artifacts/
