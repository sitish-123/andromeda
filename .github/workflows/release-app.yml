# A tag v* adds install.sh and the release key. Link releases the Android app from its own repo.
# Each release workflow runs on its own and adds its assets to the GitHub release of the tag, which the first one to
# finish creates. Run it by hand with a tag to rebuild only that part. The assets also serve as a pacman and an apt
# repository at releases/latest/download (see README.md).
name: release-app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to build and publish", required: true }

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            install.sh
            andromeda-release.asc
          sparse-checkout-cone-mode: false
          path: src
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber src/install.sh src/andromeda-release.asc
