# A tag v* adds the signed Android app from Link's release of the same tag.
# Each release workflow runs on its own and adds its assets to the GitHub release of the tag, which the first one to
# finish creates. Run it by hand with a tag to rebuild only that part. The assets also serve as a pacman and an apt
# repository at releases/latest/download (see README.md).
name: release-app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to build and publish", required: true }

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            install.sh
            andromeda-release.asc
          sparse-checkout-cone-mode: false
          path: src
      # Link's own release signs the app (its repo holds the keystore secrets); this release reuses that APK.
      # Link's release of the same tag can still be building; wait up to 40 min for it.
      - name: Link app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 40); do
            gh release download "$TAG" -R Andromeda-Desktop/link -p '*.apk' -O andromeda-link.apk && exit 0
            sleep 60
          done
          exit 1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber andromeda-link.apk src/install.sh src/andromeda-release.asc
