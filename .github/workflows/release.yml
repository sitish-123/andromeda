# A tag v* builds the Arch packages, the Ubuntu packages and the signed Android app, and publishes them as a GitHub release. The release's
# assets are also a pacman repository: pacman.conf points at releases/latest/download (see README.md).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          chown -R builder: "$GITHUB_WORKSPACE"
      - name: Packages
        working-directory: pkg
        run: sudo -u builder env ANDROMEDA_SOURCE="file://$GITHUB_WORKSPACE" makepkg --syncdeps --noconfirm --force
      - name: Repository
        run: |
          mkdir repo
          # GitHub rewrites ':' in asset names, which would break the epoch's filenames; pacman reads the version
          # from inside the package, not its name.
          for package in pkg/*.pkg.tar.zst; do
            name=$(basename "$package")
            cp "$package" "repo/${name//:/.}"
          done
          repo-add repo/andromeda.db.tar.gz repo/*.pkg.tar.zst
          # Release assets cannot be symlinks.
          for link in andromeda.db andromeda.files; do cp --remove-destination "$(readlink -f "repo/$link")" "repo/$link"; done
      - uses: actions/upload-artifact@v4
        with:
          name: repo
          path: repo/

  # The same scripts as a local Ubuntu build: debs from debian/ in an ubuntu:26.04 container, checked by installing them.
  # The release assets are also a flat apt repository: sources.list points at releases/latest/download (see README.md).
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      # The scripts default to 6 CPUs; docker refuses more than the runner has.
      - run: echo "UBUNTU_BUILD_CPUS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: xwayland-satellite
        run: tools/deb-xwayland-satellite.sh 26.04
      - name: Packages
        run: tools/ubuntu-deb.sh --clean 26.04
      - name: Link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R sitish-123/andromeda-link -L 1 --json tagName --jq '.[0].tagName')
          gh release download "$tag" -R sitish-123/andromeda-link -p '*_amd64.deb' -D "$RUNNER_TEMP/link"
      - name: Repository
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
          out=$HOME/.cache/andromeda-ubuntu
          mkdir apt
          # GitHub rewrites ':' in asset names; Packages must list the names the assets really get.
          for deb in "$out"/deb-26.04/*.deb "$out"/xwayland-satellite-26.04/*.deb "$RUNNER_TEMP"/link/*.deb; do
            name=$(basename "$deb")
            cp "$deb" "apt/${name//:/.}"
          done
          cd apt
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -k9 Packages
          apt-ftparchive release . > Release
      - uses: actions/upload-artifact@v4
        with:
          name: apt
          path: apt/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the SDK; only the NDK and platform the app pins are added.
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-36"
      - name: Rust
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install --locked cargo-ndk
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.LINK_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/link-release.jks"
      - name: App
        working-directory: link/apps/android
        env:
          LINK_KEYSTORE: ${{ runner.temp }}/link-release.jks
          LINK_KEYSTORE_PASSWORD: ${{ secrets.LINK_KEYSTORE_PASSWORD }}
          LINK_VERSION_CODE: ${{ github.run_number }}
          LINK_VERSION_NAME: ${{ github.ref_name }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/andromeda-link.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: andromeda-link.apk

  release:
    needs: [packages, ubuntu, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v4
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes repo/* apt/* android/andromeda-link.apk src/install.sh
