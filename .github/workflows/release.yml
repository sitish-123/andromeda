# A tag v* builds the Arch and Ubuntu packages, adds the signed Android app from Link's release, and publishes them
# as a GitHub release. The assets are also a pacman and an apt repository at releases/latest/download (see README.md).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          chown -R builder: "$GITHUB_WORKSPACE"
      - name: Packages
        working-directory: pkg
        run: sudo -u builder env ANDROMEDA_SOURCE="file://$GITHUB_WORKSPACE" makepkg --syncdeps --noconfirm --force
      - name: Repository
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          mkdir repo
          # GitHub rewrites ':' in asset names, which would break the epoch's filenames; pacman reads the version
          # from inside the package, not its name.
          for package in pkg/*.pkg.tar.zst; do
            name=$(basename "$package")
            cp "$package" "repo/${name//:/.}"
          done
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          for package in repo/*.pkg.tar.zst; do gpg --batch --detach-sign --no-armor -u "$key" "$package"; done
          repo-add --sign --key "$key" repo/andromeda.db.tar.gz repo/*.pkg.tar.zst
          # Release assets cannot be symlinks.
          for link in andromeda.db andromeda.db.sig andromeda.files andromeda.files.sig; do cp --remove-destination "$(readlink -f "repo/$link")" "repo/$link"; done
      - uses: actions/upload-artifact@v4
        with:
          name: repo
          path: repo/

  # The same scripts as a local Ubuntu build: debs from debian/ in an ubuntu:26.04 container, checked by installing them.
  # The release assets are also a flat apt repository: sources.list points at releases/latest/download (see README.md).
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      # The scripts default to 6 CPUs; docker refuses more than the runner has.
      - run: echo "UBUNTU_BUILD_CPUS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: xwayland-satellite
        run: tools/deb-xwayland-satellite.sh 26.04
      - name: Packages
        run: tools/ubuntu-deb.sh --clean 26.04
      - name: Link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R sitish-123/andromeda-link -L 1 --json tagName --jq '.[0].tagName')
          gh release download "$tag" -R sitish-123/andromeda-link -p '*_amd64.deb' -D "$RUNNER_TEMP/link"
      - name: Repository
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
          out=$HOME/.cache/andromeda-ubuntu
          mkdir apt
          # GitHub rewrites ':' in asset names; Packages must list the names the assets really get.
          for deb in "$out"/deb-26.04/*.deb "$out"/xwayland-satellite-26.04/*.deb "$RUNNER_TEMP"/link/*.deb; do
            name=$(basename "$deb")
            cp "$deb" "apt/${name//:/.}"
          done
          cd apt
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -k9 Packages
          apt-ftparchive release . > Release
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
      - uses: actions/upload-artifact@v4
        with:
          name: apt
          path: apt/

  release:
    needs: [packages, ubuntu]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            install.sh
            andromeda-release.asc
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v4
      # Link's own release signs the app (its repo holds the keystore secrets); this release reuses that APK.
      - name: Link app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A Link release with the same tag can still be building; wait up to 40 min for it.
          for _ in $(seq 40); do
            gh release download "$GITHUB_REF_NAME" -R sitish-123/andromeda-link -p '*.apk' -O andromeda-link.apk && exit 0
            sleep 60
          done
          exit 1
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes repo/* apt/* andromeda-link.apk src/install.sh src/andromeda-release.asc
