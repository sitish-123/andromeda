# Every push to main: Link's gate and its network E2E tests, and the whole desktop built with the compositor's tests,
# in an Arch container with the same dependencies the packages use, and in Ubuntu 26.04 with its debs installed. Other branches and pull requests are checked
# locally (CONTRIBUTING.md); a newer push to main cancels the run before it.
name: check

on:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          rustup component add clippy rustfmt
      - uses: taiki-e/install-action@cargo-deny
      - name: Gate
        working-directory: link
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo deny check

  link-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            dbus libglib2.0-bin python3-gi iproute2 nftables
          # The tests put the phone and the desktop in their own user and network namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        working-directory: link
        run: cargo build
      - name: Tests
        run: |
          for test in link_pair link_share link_status link_files link_firewall link_bluetooth link_hotspot \
            link_wifi_direct link_tailnet quickshare_daemon; do
            echo "::group::$test"
            bash "tests/e2e/$test.sh"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-e2e-artifacts
          path: artifacts/

  desktop:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed git just
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build dependencies
        run: |
          source pkg/PKGBUILD
          pacman -S --noconfirm --needed "${makedepends[@]}"
      - name: Build
        run: just build
      - name: Compositor tests
        working-directory: compositor
        run: just test

  # docs/ubuntu-port.md 4: the same build on Ubuntu 26.04, the apt update backend's tests, and the debs installed with
  # apt. The tools/ scripts run their own containers, so the job runs on the host.
  desktop-ubuntu:
    runs-on: ubuntu-latest
    env:
      UBUNTU_BUILD_CPUS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: tools/ubuntu-build.sh 26.04
      - name: Apt update backend
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/system:/src" -w /src \
            andromeda-build:ubuntu-26.04 bash -c 'for crate in andromeda-update andromeda-update-helper; do
              cargo clippy -p "$crate" --no-default-features --features apt --all-targets -- -D warnings &&
              cargo test -p "$crate" --no-default-features --features apt || exit 1; done'
      - name: Apt update backend against a local repo
        run: tests/ubuntu/apt_update.sh 26.04
      - name: Packages
        run: |
          tools/deb-xwayland-satellite.sh 26.04
          tools/ubuntu-deb.sh --clean 26.04
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-26.04-logs
          path: |
            ~/.cache/andromeda-ubuntu/*/*.log
