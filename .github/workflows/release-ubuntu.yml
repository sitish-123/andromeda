# A tag v* builds the Ubuntu 26.04 and Debian testing debs and signs an apt repository for each, with Link's deb from Link's release of the same tag.
# Each release workflow runs on its own and adds its assets to the GitHub release of the tag, which the first one to
# finish creates. Run it by hand with a tag to rebuild only that part. The assets also serve as a pacman and an apt
# repository at releases/latest/download (see README.md).
name: release-ubuntu

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to build and publish", required: true }
      ref: { description: "Commit or branch to build instead of the tag, for a packaging fix", required: false }
      prebuilt: { description: "Sign the debs already on the release instead of building them", type: boolean, default: false }

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The same scripts as a local build: debs from debian/ in an ubuntu:26.04 or debian:testing container, checked by
  # installing them. Each set is a flat apt repository: Ubuntu's in the tag's release (releases/latest/download), Debian's
  # in the rolling release "debian", because both sets use the same asset names (see README.md).
  # Debian testing also serves sid and Kali; Debian 13 lacks libglycin-2.
  ubuntu:
    name: ${{ matrix.base }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A prebuilt run signs the Ubuntu debs a local build uploaded; Debian always builds in CI.
        base: ${{ fromJSON(inputs.prebuilt && '["26.04"]' || '["26.04", "testing"]') }}
    steps:
      # The scripts default to 6 CPUs; docker refuses more than the runner has.
      - run: echo "UBUNTU_BUILD_CPUS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || env.TAG }}
      - name: xwayland-satellite
        if: ${{ !inputs.prebuilt }}
        run: tools/deb-xwayland-satellite.sh ${{ matrix.base }}
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.prebuilt }}
        with:
          path: ~/.cache/andromeda-ubuntu/ccache-deb-${{ matrix.base }}
          key: ccache-deb-${{ matrix.base }}-${{ github.run_id }}
          restore-keys: ccache-deb-${{ matrix.base }}-
      - name: Packages
        if: ${{ !inputs.prebuilt }}
        run: DEB_VERSION=${TAG#v} tools/ubuntu-deb.sh --clean ${{ matrix.base }}
      - uses: actions/cache/save@v4
        if: always() && !inputs.prebuilt
        with:
          path: ~/.cache/andromeda-ubuntu/ccache-deb-${{ matrix.base }}
          key: ccache-deb-${{ matrix.base }}-${{ github.run_id }}
      # A local build (DEB_VERSION=<tag without v> tools/ubuntu-deb.sh) uploads its debs to the release first; this
      # only signs the repository.
      - name: Prebuilt debs
        if: ${{ inputs.prebuilt }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.deb' -D "$HOME/.cache/andromeda-ubuntu/deb-${{ matrix.base }}"
      - name: Link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Link's release of the same tag can still be building; wait up to 40 min for it.
          for _ in $(seq 40); do
            gh release download "$TAG" -R sitish-123/andromeda-link -p '*_amd64.deb' -D "$RUNNER_TEMP/link" && exit 0
            sleep 60
          done
          exit 1
      - name: Repository
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          BASE: ${{ matrix.base }}
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
          out=$HOME/.cache/andromeda-ubuntu
          shopt -s nullglob
          mkdir apt
          # GitHub rewrites ':' in asset names; Packages must list the names the assets really get.
          for deb in "$out"/deb-$BASE/*.deb "$out"/xwayland-satellite-$BASE/*.deb "$RUNNER_TEMP"/link/*.deb; do
            name=$(basename "$deb")
            cp "$deb" "apt/${name//:/.}"
          done
          cd apt
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -k9 Packages
          apt-ftparchive release . > Release
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
      - uses: actions/upload-artifact@v4
        with:
          name: apt-${{ matrix.base }}
          path: apt/

  publish:
    needs: [ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            install.sh
            andromeda-release.asc
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v4
        with: { name: apt-26.04, path: apt }
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.prebuilt }}
        with: { name: apt-testing, path: apt-debian }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber apt/* src/install.sh src/andromeda-release.asc
          [[ -d apt-debian ]] || exit 0
          # Upload first, then drop the old release's debs, so the Debian repository never lists a missing file.
          gh release view debian --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create debian --repo "$GITHUB_REPOSITORY" \
            --latest=false --title "Debian apt repository" --notes "Rolling apt repository for Debian testing, sid and Kali. See README.md."
          gh release upload debian --repo "$GITHUB_REPOSITORY" --clobber apt-debian/*
          gh release view debian --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r name; do
            [[ -e apt-debian/$name ]] || gh release delete-asset debian "$name" --repo "$GITHUB_REPOSITORY" -y
          done
