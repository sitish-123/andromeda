# The desktop built in Ubuntu 26.04 with its debs installed.
# A newer push to main cancels the run before it. Other branches and pull requests are checked locally (CONTRIBUTING.md).
name: check-ubuntu

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!link"
      - "!**.md"
      - "!docs/**"
      - "!.github/workflows/**"
      - ".github/workflows/check-ubuntu.yml"
  workflow_dispatch:

concurrency:
  group: check-ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs/ubuntu-port.md 4: the same build on Ubuntu 26.04, the apt update backend's tests, and the debs installed with
  # apt. The tools/ scripts run their own containers, so the job runs on the host.
  desktop-ubuntu:
    runs-on: ubuntu-latest
    env:
      UBUNTU_BUILD_CPUS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/andromeda-ubuntu/build-26.04/ccache
            ~/.cache/andromeda-ubuntu/build-26.04/cargo
            ~/.cache/andromeda-ubuntu/build-26.04/target
          key: ubuntu-26.04-build-${{ github.run_id }}
          restore-keys: ubuntu-26.04-build-
      - name: Build
        run: tools/ubuntu-build.sh 26.04
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ~/.cache/andromeda-ubuntu/build-26.04/ccache
            ~/.cache/andromeda-ubuntu/build-26.04/cargo
            ~/.cache/andromeda-ubuntu/build-26.04/target
          key: ubuntu-26.04-build-${{ github.run_id }}
      - name: Apt update backend
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/system:/src" -w /src \
            andromeda-build:ubuntu-26.04 bash -c 'for crate in andromeda-update andromeda-update-helper; do
              cargo clippy -p "$crate" --no-default-features --features apt --all-targets -- -D warnings &&
              cargo test -p "$crate" --no-default-features --features apt || exit 1; done'
      - name: Apt update backend against a local repo
        run: tests/ubuntu/apt_update.sh 26.04
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/andromeda-ubuntu/ccache-deb-26.04
          key: ccache-deb-26.04-${{ github.run_id }}
          restore-keys: ccache-deb-26.04-
      - name: Packages
        run: |
          tools/deb-xwayland-satellite.sh 26.04
          tools/ubuntu-deb.sh --clean 26.04
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ~/.cache/andromeda-ubuntu/ccache-deb-26.04
          key: ccache-deb-26.04-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ubuntu-26.04-logs
          path: |
            ~/.cache/andromeda-ubuntu/*/*.log
