# Feature map: where each feature lives. One [[feature]] per feature.
# Fields: name, keywords (list), module, entry (1-5 main file paths, repo-relative),
# test (test name, file or dir; "" if none), build (compositor|shell|greeter|system|link),
# notes (optional, one line).
