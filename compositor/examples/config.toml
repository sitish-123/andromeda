# Andromeda starting configuration
#
# Copy this file to ~/.config/andromeda/config.toml. Most changes apply when the
# file is saved. Check edits with `andromeda config validate`.
#
# Complete reference: https://docs.noctalia.dev/andromeda/
#
# Commented settings below are examples, not built-in defaults.

# ==============================================================================
# Includes

# Optional split configuration
# https://docs.noctalia.dev/andromeda/configuration/#include
[include]
files = []

[include.optional]
files = []

# ==============================================================================
# General
# Optional session examples. XWayland support is enabled by default.
# https://docs.noctalia.dev/andromeda/configuration/#general
#
[general]
# autostart = ["andromeda-shell", "kitty"]
# xwayland = false
# Sharp X11 apps and games on scaled outputs; they see physical resolutions.
# xwayland_native_resolution = true
# Andromeda announces the X11 interface scale and cursor theme through XSETTINGS.
# Turn this off to run your own manager, such as xsettingsd.
# xwayland_xsettings = false
# Modal dialogs hang on their parent window and follow it. Turn this off to keep them ordinary windows.
# attach_modal_dialogs = false
# Freeze applications with no open window after 10 min on battery, as if they had qos = "freeze_when_hidden".
# freeze_background_apps = true
# Hidden apps move to lower CPU priority and efficiency cores. Turn this off to keep every app at full priority.
# optimize_background_apps = false

# ==============================================================================
# Lid events
# Remove the laptop panel from the desktop while the lid is closed, then
# restore it when the lid opens. Replace eDP-1 with the name from
# `andromeda outputs`.
# https://docs.noctalia.dev/andromeda/configuration/#events
#
# [events]
# lid_close = "andromeda msg output-disable:eDP-1"
# lid_open = "andromeda msg output-enable:eDP-1"

# ==============================================================================
# Screencast
# By default, the first target-changing action during an active share asks for
# confirmation. Disable that protection only if immediate keybind changes are
# preferred.
# https://docs.noctalia.dev/andromeda/configuration/#screencast
#
# [screencast]
# disable_dynamic_confirmation = true

# ==============================================================================
# Outputs
# Outputs are machine-specific. Run `andromeda outputs` to find names and modes.
# https://docs.noctalia.dev/andromeda/outputs/
#
# [output.DP-1]
# mode = "2560x1440@144"
# position = [0, 0]
# scale = 1.25
# vrr = "fullscreen"
# hdr = "auto"
# sdr_transfer = "gamma22" # Or "srgb" for piecewise SDR decoding in HDR.

# ==============================================================================
# Appearance
# Blur uses a smaller radius than the built-in default.
# https://docs.noctalia.dev/andromeda/appearance/
#
[appearance.blur]
radius = 3

# Optional title bar with modifier-free dragging and floating frame resizing.
# [appearance.title_bar]
# mode = "on" # Follow client decoration preferences.
# Use "negotiated" to hide bars on Wayland windows that do not negotiate decorations.
# Use "forced" to always show bars, or "off" to hide them. Window rules can override this.
# height = 28
# font = "sans 10"
# button_position = "right" # or "left"
# buttons = ["minimize", "maximize", "close"] # From the title outward; leave one out to hide it.
# button_corner_radius = -1 # Follow the window's corner_radius; 0 makes square buttons.

# Choose the background color shown if the lock screen takes too long to appear.
# [colors]
# backdrop = "#000000FF"

# ==============================================================================
# Effects
# Every effect is off until a preset is selected; border and window effects
# scale with overview zoom. Include a bundled preset (adjust /usr for the
# package prefix), then select it by name.
# https://docs.noctalia.dev/andromeda/effects/
#
# [include]
# files = ["/usr/share/andromeda/effects/border/pulse/effect.toml"]
# For a cursor tail, include /usr/share/andromeda/effects/cursor/trail/effect.toml
# and set cursor = "trail" in [effects].
# For audio-reactive borders, include /usr/share/andromeda/effects/border/audio/effect.toml
# and set border = "audio" in [effects].
# Enable Noctalia's Andromeda audio provider in its shell settings, or supply an
# external effect-audio v2 producer with 64 spectrum bands. Andromeda does not capture audio.
# Pools accept matching presets defined/included separately. This one-member
# example uses the bundled pulse preset; add other border names to choose.
#
# [effects.pool.borders]
# kind = "border"
# choose = ["pulse"]
# selection = "unused_first" # or round_robin, random
# Select with border = "borders" in your [effects] table.
# Add to your existing [keybinds] table:
# "Mod+Shift+E" = "effect-border-cycle:borders"
# "Mod+Ctrl+E" = "effect-border-toggle"
# "Mod+Alt+E" = "effect-border-reset"
#
# [effects]
# border = "pulse"

# ==============================================================================
# Input
# Enable NumLock for the first physical keyboard; later devices inherit current locks.
# https://docs.noctalia.dev/andromeda/input/
#
# [input]
# window_snapping = false # Drop dragged floating windows where released instead of snapping to edges or corners.
#
[input.keyboard]
numlock_toggle = true

# Focus can follow the pointer across tiled, floating, and pinned windows.
#
# [input.focus]
# follows_mouse = true
# hover_raises = false # Hover focuses only; clicks and keybinds raise.

# Confine touch input to one display.
#
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"

# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/andromeda/keybinds/
# Actions: https://docs.noctalia.dev/andromeda/actions/
[keybinds]

# Applications and session
# Terminal and Files open the apps set in Settings > Default Apps.
"Mod+Return" = { action = "spawn:andromeda-shell msg default-app-open terminal", repeat = false }
"Ctrl+Alt+T" = { action = "spawn:andromeda-shell msg default-app-open terminal", repeat = false }
"Mod+E" = { action = "spawn:andromeda-shell msg default-app-open files", repeat = false }
"Mod" = "shell:panel-toggle launcher"
"Mod+Space" = { action = "shell:panel-toggle launcher", repeat = false }
"Mod+Period" = { action = "shell:panel-toggle launcher /emo", repeat = false }
"Mod+V" = { action = "shell:panel-toggle clipboard", repeat = false }
"Mod+A" = { action = "shell:panel-toggle control-center", repeat = false }
"Mod+N" = { action = "shell:panel-toggle notifications", repeat = false }
"Mod+I" = { action = "shell:settings-toggle", repeat = false }
"Ctrl+Shift+Escape" = { action = "shell:activity-open", repeat = false }
"Alt+Tab" = "shell:window-switcher"
"Mod+Tab" = "shell:window-switcher"
"Mod+L" = { action = "shell:session lock", repeat = false }
"Mod+Shift+L" = { action = "shell:panel-toggle control-center session", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = { action = "shell:panel-toggle control-center session", repeat = false }
"Ctrl+Alt+Delete" = { action = "shell:power-overlay", repeat = false }
# The shell holds logind's handle-power-key block: a press opens the power menu (or the Settings › Power choice),
# holding fills the shut-down ring, the release cancels it.
"XF86PowerOff" = { action = "shell:power-overlay key-down", release_action = "shell:power-overlay key-up", repeat = false, allow_when_locked = true }
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Media, volume and brightness keys from any input device, routed through the
# Noctalia shell so its OSDs show. Safe while the session is locked.
# https://docs.noctalia.dev/noctalia/compositor-settings/andromeda
"XF86AudioRaiseVolume" = { action = "spawn:andromeda-shell msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:andromeda-shell msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:andromeda-shell msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn:andromeda-shell msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn:andromeda-shell msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:andromeda-shell msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:andromeda-shell msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:andromeda-shell msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:andromeda-shell msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:andromeda-shell msg brightness-down", allow_when_locked = true }

# Screenshots and screen recording
"Print" = { action = "shell:screenshot-region", repeat = false }
"Mod+Shift+S" = { action = "shell:screenshot-region", repeat = false }
"Ctrl+Print" = { action = "shell:screenshot-fullscreen", repeat = false }
"Alt+Print" = { action = "shell:screenshot-window", repeat = false }
"Shift+Print" = { action = "shell:screenshot-annotate", repeat = false }
"Mod+Shift+R" = { action = "shell:screen-record-toggle", repeat = false }

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+BracketLeft" = "window-focus-left"
"Mod+BracketRight" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Comma" = "window-consume-left"
"Mod+Shift+Period" = "window-consume-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
# Needs layout.mode = "dwindle".
# "Mod+Alt+T" = "layout-toggle-split"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+WheelUp" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelDown" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+Left" = "workspace-previous"
"Mod+Ctrl+Right" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# Scratchpad
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+S" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Ctrl+S" = "scratchpad-focus-next"

# ==============================================================================
# Layout
# New scrolling-layout windows start at half the output width. Without this
# setting, each application chooses its starting width. Stacked columns retain
# their most recently focused row when focus leaves and later returns.
# https://docs.noctalia.dev/andromeda/layout/
[layout]
# mode = "scrolling" # "scrolling", "dwindle", "master", or "floating".
extent_presets = [0.333, 0.5, 0.667]

# What a tiled window's own maximize button does: "column" fills the column,
# "edges" fills the usable area without struts, gaps, or borders. The
# window-toggle-maximize action is unaffected.
# client_maximize = "column"

[layout.scrolling]
default_extent_fraction = 0.5
# Center the window picked in the overview, as column-center would.
# center_on_overview_select = true

# A tab group shows one window at a time below a bar of titles, and stacks and
# resizes like any row of its column. Mod+W tabs the focused window with the
# windows stacked beside it; Mod+Shift+J/K move a tab out of its group or a
# window into one. Click, scroll, or drag a title to switch, reorder, or pull it
# out.
# [layout.tabs]
# default_display = "normal"
# new_tab_position = "after_active"
# middle_click_closes = true
#
# [appearance.tab_bar]
# style = "titles"         # "indicator" draws thin slots without titles
# height = 24
# gap = -1                 # space between bar and window; -1 follows layout.gap
# font = "sans 10"
# visible = true           # false hides every bar; tabs keep working
# hide_when_single = false
# max_tabs = 6            # show at most 6 slots; more tabs scroll
# overflow = "scroll"      # or "shrink" to fit every tab

# ==============================================================================
# Window rules
# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/andromeda/window-rules/

# Blur windows over the cached wallpaper blur. Set blur_optimized = false to
# include overlapping windows behind them, at a GPU cost on every frame that
# moves anything behind them.
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
# Settings is an app window: a 1020 px column when scrolling, 1020 x 900 when it floats.
default_scrolling_extent_px = 1020
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.AndromedaSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Keep game menus inside their window; a focus or workspace keybind releases the pointer.
# [[window_rule]]
# match.app_id = "^steam_app_.*$"
# confine_pointer = true

# Keep compositor shortcuts available while a virtual machine window is focused.
# [[window_rule]]
# match.app_id = "^virt-manager$"
# allow_shortcuts_inhibit = false

# Keep an application drawing while it is hidden on another workspace, for programs whose other work stalls without it.
# [[window_rule]]
# match.app_id = "^obs$"
# background_render = true

# Quality of service while an application is hidden: "normal" moves it to the efficiency cores after 5 s,
# "never_throttle" keeps its full share, "freeze_when_hidden" also freezes it after 10 min hidden on battery.
# [[window_rule]]
# match.app_id = "^discord$"
# qos = "freeze_when_hidden"

# Keep one application's modal dialogs as ordinary windows.
# [[window_rule]]
# match.app_id = "^gimp"
# match.is_dialog = true
# attach_to_parent = false

# Named scratchpads can launch an application when toggled while empty.
# [[scratchpad]]
# name = "music"
# spawn_when_empty = "spotify"

# [[window_rule]]
# match.app_id = "^spotify$"
# default_scratchpad = "music"

# Give scratchpad windows their own border colors.
# [[window_rule]]
# match.is_scratchpad = true
# border_color_focused = "#E5C07BFF"
# border_color_unfocused = "#5C4A2AFF"

# Hide enabled title bars only while a window is maximized to edges.
# [[window_rule]]
# match.is_maximized_to_edges = true
# title_bar = "off"

# Frame the window being screencast; viewers never see the frame.
# [[window_rule]]
# match.is_cast_target = true
# border_color_focused = "#40C057FF"
# border_color_unfocused = "#40C057FF"

# Leave an application that draws its own corners and shadow undecorated.
# [[window_rule]]
# match.app_id = "^org[.]gnome[.]TextEditor$"
# border_width = 0
# corner_radius = 0
# shadow = false

# ==============================================================================
# Layer rules
# https://docs.noctalia.dev/andromeda/layer-rules/
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

# Panels, the dock, notifications and OSDs open over windows, so they blur the
# live content behind them. The bar and desktop widgets sit on the wallpaper and
# keep the cached wallpaper blur.
[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
# Overview
# Built-in overview and animation values are used. The top-left hot corner opens
# the overview after a short delay.
# Overview: https://docs.noctalia.dev/andromeda/workspaces-overview/
# Animation: https://docs.noctalia.dev/andromeda/animation/
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

# Optional live workspace reveal (see docs/user/animation.md).
# Add the bundled effects/animation/workspace_wipe/effect.toml to your includes.
# [animation.workspaces]
# style = "reveal"          # Default: "slide"
# effect = "workspace_wipe"
# duration_ms = 300
# curve = "easeout"

# Shade over a window while a modal dialog is attached to it.
# [animation.dialogs]
# dim = 0.3
